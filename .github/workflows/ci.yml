# Tests on every push and pull request.
#
# Releases are handled separately - see release.yml, which runs on a v*
# tag and publishes the packaged artifact.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A new push to the same branch supersedes the run in progress.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: System checks
        run: python manage.py check

      - name: Test suite
        run: python manage.py test --verbosity 2

  deploy-check:
    # Catches settings and static-asset regressions that the unit tests
    # cannot see: production settings must boot, collectstatic must resolve
    # every referenced asset, and Django's own deployment checklist must be
    # clean - warnings included.
    name: Production settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: collectstatic and --deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
        run: |
          export DJANGO_SECRET_KEY="ci-only-$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          python manage.py collectstatic --noinput
          python manage.py check --deploy --fail-level WARNING
