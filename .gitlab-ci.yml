# Test on every push; on a `v*` tag, build a deployable artifact, publish it
# to the Generic Package Registry and cut a GitLab Release pointing at it.
#
# Release a version:
#   1. bump __version__ in config/__init__.py
#   2. add the section to CHANGELOG.md
#   3. git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# No CI/CD variables need configuring - CI_JOB_TOKEN is provided by GitLab
# and is enough to publish packages and create releases in this project.

stages:
  - test
  - build
  - release

default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .pip-cache

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PACKAGE_NAME: "holiday-planning-tool"

# ---------------------------------------------------------------- test ----
test:
  stage: test
  script:
    - pip install -r requirements.txt
    - python manage.py check
    - python manage.py test --verbosity 2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Catches a settings/static regression that unit tests would not: production
# settings must boot, collectstatic must succeed and --deploy must be clean.
deploy-check:
  stage: test
  script:
    - pip install -r requirements.txt
    - export DJANGO_SETTINGS_MODULE=config.settings.prod
    - export DJANGO_SECRET_KEY="ci-only-$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
    - python manage.py collectstatic --noinput
    - python manage.py check --deploy --fail-level WARNING
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# --------------------------------------------------------------- build ----
build:
  stage: build
  script:
    - VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' config/__init__.py)
    - test -n "$VERSION" || { echo "Could not read __version__ from config/__init__.py"; exit 1; }
    # The tag is the release's identity, so refuse to ship if the code
    # disagrees with it - a mismatched version is worse than a failed build.
    - |
      if [ "v$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "Tag $CI_COMMIT_TAG does not match __version__ $VERSION (expected tag v$VERSION)."
        exit 1
      fi
    - mkdir -p dist
    # git archive ships only tracked files, so untracked things - the
    # SQLite database, .env, staticfiles/, .venv/, editor and OS junk -
    # cannot end up in a release by accident. --prefix gives the tarball a
    # top-level directory instead of unpacking over the current one.
    - |
      git archive --format=tar.gz \
        --prefix="${PACKAGE_NAME}-${VERSION}/" \
        -o "dist/${PACKAGE_NAME}-${VERSION}.tar.gz" \
        "$CI_COMMIT_TAG"
    - sha256sum "dist/${PACKAGE_NAME}-${VERSION}.tar.gz" | tee "dist/${PACKAGE_NAME}-${VERSION}.tar.gz.sha256"
    - echo "VERSION=$VERSION" >> build.env
  artifacts:
    paths:
      - dist/
    reports:
      dotenv: build.env
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ------------------------------------------------------------- package ----
publish-package:
  stage: release
  needs: ["build"]
  image: curlimages/curl:latest
  script:
    - |
      for file in "${PACKAGE_NAME}-${VERSION}.tar.gz" "${PACKAGE_NAME}-${VERSION}.tar.gz.sha256"; do
        echo "Uploading $file"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "dist/${file}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${file}"
        echo
      done
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ------------------------------------------------------------- release ----
create-release:
  stage: release
  needs: ["build", "publish-package"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating GitLab Release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    # Taken from the annotated tag's own message, so the changelog entry you
    # write when tagging is what appears on the release page.
    description: "$CI_COMMIT_TAG_MESSAGE"
    assets:
      links:
        - name: "${PACKAGE_NAME}-${VERSION}.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${PACKAGE_NAME}-${VERSION}.tar.gz"
          link_type: "package"
        - name: "SHA256 checksum"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${PACKAGE_NAME}-${VERSION}.tar.gz.sha256"
          link_type: "other"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
